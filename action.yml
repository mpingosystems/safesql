# Root action manifest — this is what `uses: mpingosystems/safesql@v1` resolves to.
#
# GitHub looks for action.yml at the ROOT of the repository named in `uses:`,
# so this file must stay here even though the action's source and bundle live
# in action/. Keep the inputs/outputs in sync with action/action.yml; `main`
# below is repo-root-relative and points at the same ncc bundle.
name: SafeSQL Validate
description: "Validate SQL files for semantic errors before merge"
branding:
  icon: shield
  color: purple
inputs:
  mode:
    description: "validate (glob files) | pr-review (comment inline on changed SQL in a PR)"
    required: false
    default: "validate"
  github_token:
    # NB: no ${{ }} expressions anywhere in this file, descriptions included.
    # GitHub evaluates them when loading action metadata, where the `secrets`
    # context does not exist — one in a description fails the whole load.
    description: "Token for pr-review mode. Pass the workflow's GITHUB_TOKEN secret. Needs pull-requests: write."
    required: false
  comment_mode:
    description: "pr-review only: block (fail the check) | warn (comment without blocking)"
    required: false
    default: "block"
  sql_files:
    description: "Glob pattern for SQL files to validate"
    required: false
    default: "**/*.sql"
  schema_file:
    description: "Path to DDL schema file (optional)"
    required: false
  dialect:
    description: "SQL dialect: postgresql | mysql | bigquery | snowflake"
    required: false
    default: "postgresql"
  fail_on_warnings:
    description: "Fail if warnings found (default: only fail on errors)"
    required: false
    default: "false"
  api_key:
    description: "SafeSQL API key (Pro/Team tier for AI explanations)"
    required: false
outputs:
  issues_found:
    description: "Number of issues found across all files"
  files_checked:
    description: "Number of SQL files checked"
runs:
  using: "node24"
  main: "action/dist/index.js"
